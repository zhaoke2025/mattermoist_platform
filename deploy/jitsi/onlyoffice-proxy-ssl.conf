proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $proxy_connection;
proxy_set_header Host $this_host;
proxy_set_header X-Forwarded-Host $proxy_x_forwarded_host;
proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_hide_header 'Server';
proxy_hide_header 'X-Powered-By';
proxy_buffering off;
proxy_http_version 1.1;

proxy_buffer_size 128k;
proxy_buffers 8 128k;
proxy_busy_buffers_size 256k;

access_log /var/log/nginx/access-proxy.log;
error_log /var/log/nginx/error-proxy.log;

server {
    listen 0.0.0.0:80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include includes/letsencrypt.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 127.0.0.1:80;
    listen [::1]:80;
    server_name localhost;

    client_max_body_size 4G;

    location / {
        proxy_pass http://$router_host:8092;
    }
}

server {
    listen 0.0.0.0:443 ssl;
    listen [::]:443 ssl default_server;
    listen 0.0.0.0:443 quic reuseport;
    listen [::]:443 quic reuseport;
    server_name docs.rongsunai.com;

    root /usr/share/nginx/html;
    client_max_body_size 4G;

    ssl_certificate /usr/local/share/ca-certificates/tls.crt;
    ssl_certificate_key /etc/ssl/private/tls.key;
    ssl_verify_client off;
    ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache builtin:1000 shared:SSL:10m;
    ssl_prefer_server_ciphers on;
    ssl_dhparam /etc/ssl/certs/dhparam.pem;

    add_header Strict-Transport-Security max-age=31536000;
    add_header X-Content-Type-Options nosniff;
    add_header alt-svc 'h3=":443"; ma=86400';

    location / {
        proxy_pass http://$router_host:8092;
    }
}

server {
    listen 0.0.0.0:443 ssl;
    listen [::]:443 ssl;
    server_name chat.rongsunai.com;

    client_max_body_size 100M;

    ssl_certificate /usr/local/share/ca-certificates/tls.crt;
    ssl_certificate_key /etc/ssl/private/tls.key;
    ssl_verify_client off;
    ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache builtin:1000 shared:SSL:10m;
    ssl_prefer_server_ciphers on;
    ssl_dhparam /etc/ssl/certs/dhparam.pem;

    add_header Strict-Transport-Security max-age=31536000;
    add_header X-Content-Type-Options nosniff;

    location / {
        proxy_pass http://mattermost:8065;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $proxy_connection;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 0.0.0.0:443 ssl;
    listen [::]:443 ssl;
    server_name meet.rongsunai.com;

    ssl_certificate /usr/local/share/ca-certificates/tls.crt;
    ssl_certificate_key /etc/ssl/private/tls.key;
    ssl_verify_client off;
    ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache builtin:1000 shared:SSL:10m;
    ssl_prefer_server_ciphers on;
    ssl_dhparam /etc/ssl/certs/dhparam.pem;

    add_header Strict-Transport-Security max-age=31536000;
    add_header X-Content-Type-Options nosniff;

    location / {
        proxy_pass http://jitsi-web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $proxy_connection;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
