services:
  ai-file-bot:
    build:
      context: ./ai-file-bot
    restart: ${RESTART_POLICY}
    depends_on:
      - mattermost
    environment:
      - MATTERMOST_URL=http://mattermost:8065
      - MATTERMOST_TOKEN=${AI_FILE_BOT_MATTERMOST_TOKEN}
      - BOT_USERNAME=${AI_FILE_BOT_USERNAME}
      - OPENAI_BASE_URL=${AI_FILE_BOT_OCR_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - OPENAI_API_KEY=${AI_FILE_BOT_OCR_API_KEY}
      - OPENAI_MODEL=${AI_FILE_BOT_ANALYSIS_MODEL:-qwen3.5-flash}
      - OPENAI_MAX_TOKENS=${AI_FILE_BOT_OPENAI_MAX_TOKENS}
      - OCR_BASE_URL=${AI_FILE_BOT_OCR_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - OCR_API_KEY=${AI_FILE_BOT_OCR_API_KEY}
      - OCR_MODEL=${AI_FILE_BOT_OCR_MODEL:-qwen3.5-ocr}
      - OCR_MAX_TOKENS=${AI_FILE_BOT_OCR_MAX_TOKENS:-4096}
      - OCR_TIMEOUT_SECONDS=${AI_FILE_BOT_OCR_TIMEOUT_SECONDS:-90}
      - OCR_MAX_WORKERS=${AI_FILE_BOT_OCR_MAX_WORKERS:-5}
      - OCR_PDF_DPI=${AI_FILE_BOT_OCR_PDF_DPI:-200}
      - OCR_MAX_PDF_PAGES=${AI_FILE_BOT_OCR_MAX_PDF_PAGES:-20}
      - OCR_MIN_CHARS=${AI_FILE_BOT_OCR_MIN_CHARS:-2}
      - PADDLE_OCR_LANG=${AI_FILE_BOT_PADDLE_OCR_LANG:-ch}
      - PADDLE_OCR_DEVICE=${AI_FILE_BOT_PADDLE_OCR_DEVICE:-cpu}
      - POLL_INTERVAL_SECONDS=${AI_FILE_BOT_POLL_INTERVAL_SECONDS}
      - MAX_FILES_PER_REQUEST=${AI_FILE_BOT_MAX_FILES_PER_REQUEST}
      - LOG_LEVEL=${AI_FILE_BOT_LOG_LEVEL}
    volumes:
      - ai_file_bot_paddle_models:/root/.paddlex

volumes:
  ai_file_bot_paddle_models:
    external: true
    name: docker_ai_file_bot_paddle_models
